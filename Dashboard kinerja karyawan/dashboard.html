<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PT Telkom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <header class="dashboard-header">
      <h1>PT Telkom</h1>
      <a href="login.html" class="logout-btn">Logout</a>
    </header>

    <!-- Content -->
    <main class="dashboard-main">
      <!-- Card section -->
      <div class="card">
        <h2>Kinerja Bulanan</h2>
        <p>85% dari target sudah tercapai bulan ini 🎯</p>
      </div>
      <div class="card">
        <h2>Kehadiran</h2>
        <p>Rata-rata kehadiran: 95% 👥</p>
      </div>
      <div class="card">
        <h2>Kepuasan Pelanggan</h2>
        <p>90% pelanggan puas dengan layanan ⭐</p>
      </div>

      <!-- Simple Table -->
      <div class="card wide">
        <h2>Data Karyawan</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Divisi</th>
              <th>Kinerja</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Budi Santoso</td>
              <td>Teknologi</td>
              <td>90%</td>
            </tr>
            <tr>
              <td>Siti Rahma</td>
              <td>Pemasaran</td>
              <td>85%</td>
            </tr>
            <tr>
              <td>Andi Pratama</td>
              <td>Customer Service</td>
              <td>88%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
